[package]
name = "slacker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Chat on Slack with native terminal media"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/slacker"

[[bin]]
name = "slacker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tempfile = "3"
textwrap = "0.16"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
